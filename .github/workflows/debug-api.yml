name: Disposable queue API diagnostics
on: pull_request
permissions:
  contents: read
  pull-requests: read
jobs:
  Diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query queue metadata and entries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -f owner=learningeconomy -f name=codex-headgreen-batch-prototype-20261106 -f branch=main -f 'query=query QueueBatchShadow($owner: String!, $name: String!, $branch: String!) { repository(owner: $owner, name: $name) { mergeQueue(branch: $branch) { configuration { maximumEntriesToBuild maximumEntriesToMerge minimumEntriesToMerge minimumEntriesToMergeWaitTime mergingStrategy } entries(first: 100) { pageInfo { hasNextPage } nodes { position state solo headCommit { oid } baseCommit { oid } pullRequest { number } } } } } }'
